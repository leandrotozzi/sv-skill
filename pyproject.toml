[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "svstyle"
dynamic = ["version"]
description = "SystemVerilog RTL style checker/formatter and rules database"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leandro Tozzi" }]
requires-python = ">=3.11"
keywords = ["systemverilog", "rtl", "formatter", "linter", "hdl", "lowrisc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyslang>=11,<12",  # v12 moved to nanobind; untested
]

[project.urls]
Homepage = "https://github.com/leandrotozzi/sv-skill"
Documentation = "https://github.com/leandrotozzi/sv-skill/blob/main/skill/systemverilog-rtl/references/tooling.md"
Changelog = "https://github.com/leandrotozzi/sv-skill/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[project.scripts]
svstyle = "svstyle.cli:main"

# rules.toml and data/ live inside the package directory; hatchling ships
# everything under `packages` that is not a dotfile, so the shipped Verible
# configs are deliberately named without a leading dot (no force-include).
[tool.hatch.version]
path = "src/svstyle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/svstyle"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
