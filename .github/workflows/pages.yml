name: pages

on:
  push:
    branches: [main]
    paths: [docs/style-guide.html]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The page is generated by `svstyle rules --gen`; CI's `rules --check` keeps it current.
      - run: mkdir site && cp docs/style-guide.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
