name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in the repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run --no-project python -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("src/svstyle/__init__.py").read())[1])')"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
